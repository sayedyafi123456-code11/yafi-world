<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="YAFI WORLD — an original 3D open-world city prototype." />
    <title>YAFI WORLD</title>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="brand">YAFI <span>WORLD</span></div>
        <div class="mission">OPEN WORLD PROTOTYPE <b>•</b> BUILD 001</div>
        <div class="help" id="help">WASD / ARROWS · DRAG TO LOOK</div>
      </div>
      <div id="crosshair"></div>
      <div id="mobile-controls">
        <div class="pad">
          <button data-move="forward">▲</button>
          <div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div>
        </div>
        <div class="look-hint">DRAG RIGHT SIDE TO LOOK</div>
      </div>
      <div id="loading">BUILDING THE CITY…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
